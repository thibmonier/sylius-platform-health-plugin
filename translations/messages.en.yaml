tmonier_platform_health:
    result:
        budget_exceeded: 'Time budget exceeded (%budget_ms% ms): the check is not conclusive.'
        check_failed: 'The check could not be completed: see the application log.'
        detail_hidden: 'The detail was hidden: see the application log.'
    environment:
        support:
            ok: '%name% %version%: supported until %date% (%days% days left).'
            warning: '%name% %version%: support ends on %date% (%days% days left).'
            critical: '%name% %version%: support ended on %date%.'
            branch_missing: '%name% %version%: branch absent from the end-of-support table.'
            unreadable: '%name%: the version cannot be read.'
            table_stale: '%name% %version%: dates table to renew (table of %table%).'
            maintenance_ended: '%name% %version%: maintenance ended, security fixes until %date% (%days% days left).'
            detail:
                table: 'Table of %table%.'
                kernel: 'Dates provided by Symfony itself.'
        extensions:
            ok: 'All the required PHP extensions are loaded.'
            missing: 'Required PHP extensions are missing.'
            detail: 'Missing: %missing%.'
        opcache:
            ok: 'OPcache is active.'
            inactive: 'OPcache is inactive for this PHP SAPI.'
            restricted: 'OPcache state cannot be read (restricted API).'
        app_debug:
            ok: 'Production environment, debug mode disabled.'
            debug_in_prod: 'Debug mode is active in production.'
            not_prod: 'The application runs in the "%environment%" environment, not in production.'
        cache_pool:
            ok: 'The application cache keeps what it is given.'
            failed: 'The application cache does not keep what it is given: see the log and its configuration.'
        writable_dirs:
            ok: 'The cache, log and media directories are writable.'
            not_writable: 'Directories not writable: %directories%.'
    data:
        connection:
            ok: 'The database answers (%duration_ms% ms).'
            slow: 'The database answers slowly: %duration_ms% ms (threshold: %threshold_ms% ms).'
            unreachable: 'The database does not answer: see the application log.'
        pending_migrations:
            ok: 'Every Doctrine migration is executed.'
            pending: '{1} One Doctrine migration is pending.|]1,Inf] %count% Doctrine migrations are pending.'
            unknown_executed: '{1} One executed migration is unknown to the code.|]1,Inf] %count% executed migrations are unknown to the code.'
            not_configured: 'Doctrine migrations are not configured: the state of the schema cannot be measured.'
        schema_drift:
            ok: 'The database schema matches the Doctrine mapping.'
            drift: '{1} The database schema differs from the mapping: one statement to apply.|]1,Inf] The database schema differs from the mapping: %count% statements to apply.'
            not_available: 'No Doctrine ORM: the schema drift cannot be measured.'
        messenger:
            no_transport: 'No asynchronous Messenger transport.'
        messenger_pending:
            ok: 'No queue holds more than %threshold% waiting messages.'
            over: 'Transport %transport% holds %count% waiting messages (threshold: %threshold%).'
            not_countable: 'Transport %transport% cannot count its messages.'
        messenger_oldest:
            ok: 'No message has been waiting for more than %minutes% min.'
            late: 'The oldest message of transport %transport% has been waiting for %minutes% min.'
            not_measurable: 'The age of the messages is measured on a Doctrine transport only.'
        messenger_failed:
            ok: 'No failed message.'
            failed: '{1} One failed message.|]1,Inf] %count% failed messages.'
            no_failure_transport: 'Without a failure transport, a message that fails is lost: %transports%.'
            not_countable: 'Failure transport %transport% cannot count its messages.'
        table_growth:
            none: 'No table is watched.'
            ok: '{1} The watched table is under its threshold.|]1,Inf] The %count% watched tables are under their threshold.'
            over: 'Table %table% holds about %rows% rows (threshold: %threshold%).'
            others: '{1} One other table is beyond its threshold.|]1,Inf] %count% other tables are beyond their threshold.'
            missing: 'The watched table %table% cannot be found.'
            unsupported_platform: 'This database gives no estimate of the number of rows.'
    scheduled_tasks:
        heartbeat:
            none: 'No scheduled task declared.'
            ok: '{1} The declared scheduled task succeeded at its rhythm.|]1,Inf] The %count% declared scheduled tasks succeeded at their rhythm.'
            line_ok: '%command%: last success on %last_success%'
            late: '%command% has not succeeded since %last_success%.'
            never_succeeded: '%command% runs but never succeeded.'
            failed: '%command%: last run failed (code %exit_code%).'
            not_yet: '%command%: no heartbeat yet.'
            never_ran: '%command% has never run since the recording started.'
            unavailable: 'The heartbeats of the scheduled tasks cannot be read: run the migrations of the plugin, see the log.'
    category:
        environment: Environment
        data: Data
        scheduled_tasks: Scheduled tasks
        shop: Shop
        plugins: Plugins
    status:
        ok: OK
        warning: Warning
        critical: Critical
        unknown: Not measurable
    console:
        empty: 'No probe matches the selection.'
        summary: 'Overall status: %status% (%total% probes: %critical% critical, %warning% warning, %unknown% not measurable, %ok% OK).'
        invalid_choice: 'Value "%value%" refused for %option%. Accepted values: %allowed%.'
        invalid_only: 'No probe has the identifier "%value%".'
    ui:
        menu: Platform health
        title: Platform health
        loading: Checking the platform…
        generated_at: 'Measured at %time%.'
        refresh: Refresh
        checks: '{1} 1 check|]1,Inf[ %count% checks'
        fix: Fix
        caption: 'Checks of the category %category%'
        updated: 'Results updated. Measured at %time%.'
        dashboard:
            critical: '{1} 1 critical category|]1,Inf[ %count% critical categories'
            link: See the details
        column:
            check: Check
            status: Status
            summary: Summary
            action: Action
        empty:
            title: No health check is installed
            body: 'Add your own: a check is a class that implements HealthCheckInterface.'
            documentation: See the documentation
