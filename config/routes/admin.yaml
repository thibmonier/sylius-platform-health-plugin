# Under the administration prefix: the Sylius admin firewall (ROLE_ADMINISTRATION_ACCESS) protects the page.
tmonier_platform_health_admin_index:
    path: /platform-health
    methods: [GET]
    defaults:
        _controller: Symfony\Bundle\FrameworkBundle\Controller\TemplateController
        template: '@TmonierSyliusPlatformHealthPlugin/admin/index.html.twig'
