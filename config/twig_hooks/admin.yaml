sylius_twig_hooks:
    hooks:
        # The page reuses the common index skeleton of the administration (sidebar, navbar, content, header).
        'tmonier_platform_health.admin.index.content':
            grid:
                enabled: false
            summary:
                template: '@TmonierSyliusPlatformHealthPlugin/admin/index/summary.html.twig'
                priority: 100

        'tmonier_platform_health.admin.index.content.header':
            breadcrumbs:
                enabled: false

        'tmonier_platform_health.admin.index.content.header.title_block':
            title:
                template: '@SyliusAdmin/shared/crud/common/content/header/title_block/title.html.twig'
                configuration:
                    title: tmonier_platform_health.ui.title
                    sylius_test_html_attribute: 'platform-health-header'
                priority: 100
            actions:
                enabled: false

        # The panel of the dashboard: between the statistics (priority 100) and the latest statistics (priority 0), without
        # overriding any template of Sylius. The template renders nothing for an administrator who lacks the right.
        'sylius_admin.dashboard.index.content':
            platform_health:
                template: '@TmonierSyliusPlatformHealthPlugin/admin/dashboard/panel.html.twig'
                priority: 50
